<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - MaxiStore</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 60px 40px;
      text-align: center;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: #f0f4ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    
    h1 {
      font-size: 32px;
      color: #1a1a1a;
      margin-bottom: 15px;
      font-weight: 700;
    }
    
    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .features {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 25px;
      margin: 30px 0;
      text-align: left;
    }
    
    .features h2 {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }
    
    .feature-item:last-child {
      margin-bottom: 0;
    }
    
    .feature-item::before {
      content: '✓';
      display: inline-block;
      width: 24px;
      height: 24px;
      background: #667eea;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      margin-right: 12px;
      flex-shrink: 0;
      font-weight: bold;
      font-size: 13px;
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }
    
    button, a {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f0f4ff;
      color: #667eea;
      border: 2px solid #e0e7ff;
    }
    
    .btn-secondary:hover {
      background: #e0e7ff;
      border-color: #667eea;
    }
    
    .note {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features may be limited.</p>
    
    <div class="features">
      <h2>What you can do offline:</h2>
      <div class="feature-item">View your cart</div>
      <div class="feature-item">Browse your wishlist</div>
      <div class="feature-item">View cached products</div>
    </div>
    
    <div class="buttons">
      <button class="btn-primary" onclick="window.location.reload()">Try Again</button>
      <a href="/" class="btn-secondary">Home</a>
    </div>
    
    <div class="note">
      💡 Offline features work in production mode. Your cart and wishlist are saved locally and will sync when you're back online.
    </div>
  </div>
</body>
</html>
