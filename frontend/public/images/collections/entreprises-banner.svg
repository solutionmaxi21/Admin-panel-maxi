<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#pattern)" />
  <rect x="100" y="100" width="1000" height="200" fill="rgba(255,255,255,0.05)" rx="20" />
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle" style="text-transform: uppercase; letter-spacing: 5px; opacity: 0.8;">ENTERPRISES</text>
