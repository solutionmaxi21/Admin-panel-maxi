  <rect x="100" y="100" width="1000" height="200" fill="rgba(255,255,255,0.05)" rx="20" />
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle" style="text-transform: uppercase; letter-spacing: 5px; opacity: 0.8;">STUDENTS</text>
